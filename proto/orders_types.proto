syntax = "proto3";

package orders.v1;

message Money {
  string currency = 1;   // e.g., "BRL"
  int64 units = 2;       // 1234 -> 12.34 if scale=2
  int32 scale = 3;       // decimal places
}

message OrderItem {
  string sku = 1;
  int32 quantity = 2;
  Money unit_price = 3;
}

message CreateOrderRequest {
  string customer_id = 1;
  repeated OrderItem items = 2;
}

message CreateOrderResponse {
  string order_id = 1;
}

message GetOrderRequest {
  string order_id = 1;
}

message Order {
  string order_id = 1;
  string customer_id = 2;
  repeated OrderItem items = 3;
  Money total = 4;
  string status = 5; // e.g., "CREATED", "PAID"
}

message ListOrdersRequest {
  string customer_id = 1;
}

message HealthCheckRequest {}
message HealthCheckResponse { string status = 1; }
